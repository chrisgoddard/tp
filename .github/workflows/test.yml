name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes fish tmux jq
      - name: Check Fish syntax
        run: fish -n functions/*.fish completions/*.fish tests/*.fish
      - name: Run tests
        run: |
          fish tests/test_tp.fish
          fish tests/test_tp_shot.fish
